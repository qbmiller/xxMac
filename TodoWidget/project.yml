name: TodoWidget
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    CLANG_ENABLE_MODULES: YES
    SWIFT_VERSION: 5.0
targets:
  TodoWidgetExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: TodoWidgetExtension
        excludes:
          - Info.plist
          - TodoWidgetExtension.entitlements
      - path: ../Sources/TodoWidgetShared
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_ENTITLEMENTS: TodoWidgetExtension/TodoWidgetExtension.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TodoWidgetExtension/Info.plist
        CURRENT_PROJECT_VERSION: 1.2.0
        MARKETING_VERSION: 1.2.0
        MACOSX_DEPLOYMENT_TARGET: 14.0
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaomi318.xxMac.TodoWidget
        PRODUCT_NAME: TodoWidgetExtension
        SKIP_INSTALL: YES
        SWIFT_VERSION: 5.0
